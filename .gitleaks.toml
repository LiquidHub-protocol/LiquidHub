title = "LiquidHub public repository secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Public Arbitrum WETH and USDC token addresses in historical example configuration"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
paths = ['^pools/UNI-ARB-WETH-USDC(-DN)?/\.env\.example$']
regexes = ['^TOKEN0_ADDRESS=0x82af49447d8a07e3bd95bd0d56f35241523fbab1$', '^TOKEN1_ADDRESS=0xaf88d065e77c8cC2239327C5EDb3A432268e5831$']
