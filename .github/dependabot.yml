version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directories:
      - /pools/UNI-ARB-WETH-USDC/keeper-bot
      - /pools/UNI-ARB-WETH-USDC-DN/keeper-bot
      - /registry/adapters/core
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']
